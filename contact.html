<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Crochet Hub</title>
  <meta name="description" content="Contact Crochet Hub for custom orders and handmade crochet requests." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="./index.html" aria-label="Crochet Hub home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Crochet Hub</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="./index.html">Home</a>
        <a href="./shop.html">Shop</a>
        <a href="./about.html">About</a>
        <a href="./contact.html" class="active">Contact</a>
      </nav>
      <a class="button primary" href="./contact.html">Order a piece</a>
    </div>
  </header>

  <main>
    <section class="container inside-page">
      <span class="eyebrow">Contact</span>
      <h1>Let’s make something beautiful together.</h1>

      <div class="contact-layout">
        <div class="contact-info">
          <div class="info-card">
            <strong>Email</strong>
            <a href="mailto:crochethub@gmail.com">crochethub@gmail.com</a>
          </div>
          <div class="info-card">
            <strong>Phone</strong>
            <a href="tel:+2349135062550">+234 913 506 2550</a>
          </div>
          <div class="info-card">
            <strong>Location</strong>
            <span>New York, USA</span>
          </div>
        </div>

        <form class="contact-form" action="mailto:crochethub@gmail.com" method="post" enctype="text/plain">
          <div class="field">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" placeholder="Your name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="idea">Project details</label>
            <textarea id="idea" name="idea" placeholder="Describe the piece you want, its size, colors, and timeline." required></textarea>
          </div>
          <div class="field">
            <label for="date">Desired timeline</label>
            <input id="date" name="date" type="date" />
          </div>
          <button type="submit" class="button primary">Send request</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <div>© 2026 Crochet Hub</div>
      <div>Made with care in New York.</div>
    </div>
  </footer>
</body>
</html>
